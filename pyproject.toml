[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nonthermal-radiation"
version = "0.1.0"
description = "Spatially resolved non-thermal radiation modelling"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.scripts]
nonthermal-radiation = "nonthermal_radiation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
