[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nonthradsim"
version = "0.1.0"
description = "Spatially resolved non-thermal radiation modelling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["matplotlib", "numpy>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
